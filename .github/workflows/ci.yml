name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Pigeon & build_runner)
        run: |
          dart run pigeon --input packages/fluttea_security/pigeons/security_api.dart
          dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: dart analyze

      - name: Check UI rules
        run: ./tool/check_ui_rules.sh

      - name: Test
        run: flutter test

