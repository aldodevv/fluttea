name: fluttea
description: "Fluttea app template"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0 <3.51.0"

dependencies:
  asn1lib: ^1.6.8
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  material_ui: ^1.1.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  talker: ^5.2.0
  talker_flutter: ^5.2.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  go_router_builder: ^4.5.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  pigeon: ^30.0.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
  config:
    enable-swift-package-manager: true
